name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: TypeScript & Python Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies & check TypeScript
        run: |
          npm ci
          npx tsc --noEmit

      - name: Install uv & check Python syntax
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: |
          uv sync --frozen
          uv run python -m compileall -q bot scenario

  deploy-linux:
    name: Deploy to Linux (89.127.192.164)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy /opt/motion-aign via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret is not configured yet — skipping automatic SSH deploy."
            exit 0
          fi
          HOST="${SSH_HOST:-89.127.192.164}"
          USER="${SSH_USER:-root}"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" '
            set -e
            cd /opt/motion-aign
            git fetch origin main
            git reset --hard origin/main
            npm ci
            /root/.local/bin/uv sync --frozen
            systemctl restart motion-aign-bot.service
          '
